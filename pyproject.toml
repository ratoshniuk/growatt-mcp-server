[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growatt-mcp"
version = "0.2.0"
description = "MCP server for Growatt solar/battery/grid management"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maksym Ratoshniuk" }]
requires-python = ">=3.11"
keywords = ["mcp", "growatt", "solar", "inverter", "claude"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp>=1.28.1,<2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ratoshniuk/growatt-mcp-server"
Repository = "https://github.com/ratoshniuk/growatt-mcp-server"
Issues = "https://github.com/ratoshniuk/growatt-mcp-server/issues"
Changelog = "https://github.com/ratoshniuk/growatt-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
growatt-mcp = "growatt_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/growatt_mcp"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
