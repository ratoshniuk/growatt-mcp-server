[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growatt-mcp"
version = "0.1.0"
description = "MCP server for Growatt solar/battery/grid management"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maksym Ratoshniuk" }]
requires-python = ">=3.11"
keywords = ["mcp", "growatt", "solar", "inverter", "claude"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp>=1.28.1,<2",
    "httpx>=0.27",
]

[project.scripts]
growatt-mcp = "growatt_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/growatt_mcp"]
